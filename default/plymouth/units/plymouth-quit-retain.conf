# Plymouth quits only when the desktop has taken the screen over (olymparch-plymouth-handoff), so its last frame
# (the temple in the wallpaper's place) stays until Hyprland draws over it. plymouth-quit-wait is masked by the
# installer: getty on tty1 must start (and ask for the screen) while plymouth is still up.
[Service]
ExecStart=
ExecStart=-/usr/lib/olymparch/plymouth-handoff
TimeoutStartSec=60
