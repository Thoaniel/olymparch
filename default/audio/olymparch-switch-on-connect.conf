# Olymparch: a headset or speaker that is plugged in (USB, Bluetooth, jack) becomes the sound output at once,
# and the sound goes back when it is unplugged. Settings → Sound turns it off by setting
# olymparch.switch-on-connect = false (pulse.properties) in ~/.config/pipewire/pipewire-pulse.conf.d/90-olymparch-settings.conf.
pulse.cmd = [
    { cmd = "load-module" args = "module-switch-on-connect" flags = [ ] condition = [ { olymparch.switch-on-connect = !false } ] }
]
