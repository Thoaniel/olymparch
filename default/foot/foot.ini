# Olymparch: foot in the colours of the active theme (black and gold until a theme is written). Your own
# ~/.config/foot/foot.ini wins over this.
[main]
font=JetBrainsMono Nerd Font:size=11, JetBrains Mono:size=11, Symbols Nerd Font Mono:size=11
pad=10x8

[cursor]
style=block

[colors-dark]
alpha=1.0
cursor=0a0a0e d4a73a
background=0a0a0e
foreground=e8e6df
selection-background=3a3644
selection-foreground=f4d35e
regular0=15151c
regular1=e0605e
regular2=9cc98f
regular3=d4a73a
regular4=7aa2d4
regular5=b08ad0
regular6=6fb3c0
regular7=e8e6df
bright0=6e6a78
bright1=f08a88
bright2=b6dca9
bright3=f4d35e
bright4=9cbde6
bright5=c9a9e3
bright6=93cad4
bright7=ffffff

# The active theme's colours (olymparch-theme writes them; Settings → Appearance → Theme). Last, so they win over
# the gold above; a new terminal gets them.
[main]
include=~/.config/olymparch/theme/foot.ini
