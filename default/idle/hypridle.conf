# Olymparch: idle and lock. Your own ~/.config/hypr/hypridle.conf is used instead if it exists.
# Apps, video and games that ask the screen to stay awake (idle inhibit) stop these timers.
general {
    lock_cmd = olymparch-lock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}

listener {
    timeout = 600                      # 10 min: lock
    on-timeout = loginctl lock-session
}

listener {
    timeout = 900                      # 15 min: screens off
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}
