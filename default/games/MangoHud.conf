# Olymparch MangoHud: loaded in every game started from Steam, hidden until Shift+F12.
# Your own ~/.config/MangoHud/MangoHud.conf replaces this file completely.
no_display
toggle_hud=Shift_L+F12
position=top-left
font_size=18
background_alpha=0.75
background_color=0a0a0e
text_color=e8e6df
gpu_color=d4a73a
cpu_color=d4a73a
vram_color=d4a73a
ram_color=d4a73a
engine_color=d4a73a
frametime_color=d4a73a
fps
frametime
frame_timing
gpu_stats
gpu_temp
cpu_stats
cpu_temp
core_type
throttling_status
vram
ram
output_folder=~/.local/share/olymparch/mangohud
