; Olymparch gamemode defaults (/etc/gamemode.ini). Games are registered by olymparch-game-hook when their window
; opens, so no launch options are needed. Your own ~/.config/gamemode.ini is read after this one.
[general]
; how often gamemoded checks whether registered games are still alive (s); a closed game is dropped within this
reaper_freq=5
; 0 = leave the game's priority alone until PipeWire's realtime threads are verified with a higher value
renice=0
; the split-lock "slow down" mitigation makes some games stutter
disable_splitlock=1

[cpu]
; core pinning is per machine (P-cores only); a machine overlay turns it on where it is known to help
pin_cores=no
park_cores=no

; no [gpu] section: LACT (AMD) is the only writer of GPU power state

[custom]
; spillmodus: bar hidden, do not disturb, Zeus gives its VRAM back. The hook returns at once; the work is async.
start=/usr/bin/olymparch-game-hook start
end=/usr/bin/olymparch-game-hook end
script_timeout=10
