# The installer ISO. A tag v* (e.g. v2026.11) makes a stable release after the monthly hardware test;
# "edge" is rebuilt every Monday and on demand from main, as a pre-release.
#
# Two jobs on purpose: "build" runs mkarchiso (package scripts as root) with no secrets and a read-only token;
# "publish" only hashes, signs and uploads. Secret OLYMPARCH_SIGNING_KEY: the ASCII-armoured private key.
name: iso
on:
  push:
    tags: ['v*']
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:
concurrency: iso-${{ github.ref }}
jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      options: --privileged
    permissions:
      contents: read
    steps:
      - run: pacman -Syu --noconfirm --needed archiso git python python-pillow librsvg
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: dev/build-iso
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: iso
          path: out/*.iso
          compression-level: 0
          retention-days: 1
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: iso
          path: out
      - name: Checksums and signature
        env:
          KEY: ${{ secrets.OLYMPARCH_SIGNING_KEY }}
        run: |
          cd out
          sha256sum -- *.iso >SHA256SUMS
          [ -n "$KEY" ] || { echo "OLYMPARCH_SIGNING_KEY is not set" >&2; exit 1; }
          export GNUPGHOME=$(mktemp -d)
          printf '%s\n' "$KEY" | gpg --batch --import
          for f in *.iso SHA256SUMS; do gpg --batch --detach-sign "$f"; done
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
              gh release create "$GITHUB_REF_NAME" out/* --title "Olymparch $GITHUB_REF_NAME" --generate-notes
          else
              gh release delete edge --yes --cleanup-tag 2>/dev/null || true
              gh release create edge out/* --prerelease --target "$GITHUB_SHA" --title "Olymparch edge" \
                  --notes "Built from main ($GITHUB_SHA). Untested on real hardware: use a stable release unless you are testing."
          fi
